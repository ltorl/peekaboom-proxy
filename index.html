<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peekaboom</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--fg:#1d1d1b;--mute:#6b6b66;--card:#fff;--line:#e4e4df}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ececea;--mute:#9a9a94;--card:#1e1e1c;--line:#2e2e2b}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
  .c{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  .s{color:var(--mute);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
  h1{margin:4px 0 12px;font-size:20px}
  pre,code{white-space:pre-wrap;word-break:break-all;font-size:13px}
  pre{color:var(--mute);margin:0}
  .c{display:grid;gap:14px}
  pre{overflow-wrap:anywhere;word-break:normal}
  .r{display:flex;gap:8px;flex-wrap:wrap}
  .r input{flex:1 1 14em;min-width:0}
  input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input{min-width:0}
  button{background:var(--fg);color:var(--card);border-color:var(--fg);cursor:pointer}
  button.q{background:var(--bg);color:var(--fg);border-color:var(--line)}
  button:disabled{opacity:.5;cursor:default}
  label{display:block}
  label .s{display:block;margin-bottom:6px}
  a{color:inherit}
  .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);vertical-align:1px;margin-right:6px}
  .on .d{background:#2e9e5b}
  .off .d{background:#c8472f}
  .hide{display:none}
  hr{border:0;border-top:1px solid var(--line);margin:0}
</style>
</head>
<body>

<div class="c" id="boot">
  <div><span class="s" id="bs"><span class="d"></span>Starting</span></div>
  <h1 id="bh">Starting the proxy</h1>
  <pre id="bp">Installing the service worker for this page.</pre>
</div>

<div class="c hide" id="home">
  <div><span class="s" id="st"><span class="d"></span>Checking</span></div>
  <h1>Peekaboom</h1>
  <pre id="msg">Installing the service worker.</pre>

  <form class="r" id="go">
    <input id="url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="example.com" aria-label="Address">
    <button type="submit">Open</button>
  </form>

  <hr>

  <label>
    <span class="s">Embed a site</span>
    <pre id="eg"></pre>
  </label>

  <label>
    <span class="s">Use from index.html</span>
    <pre id="pin"></pre>
  </label>

  <form id="cfg">
    <label>
      <span class="s">Wisp relay</span>
      <span class="r">
        <input id="wisp" type="text" autocapitalize="off" spellcheck="false" placeholder="wss://anura.pro/" aria-label="Wisp relay">
        <button type="submit" class="q">Save</button>
      </span>
    </label>
  </form>

  <hr>
  <pre id="dep"></pre>
</div>

<script>
(function () {
  var WISP = 'wss://anura.pro/';
  var KEY = '__px_wisp';
  var BKEY = '__px_base';
  var sw = navigator.serviceWorker;
  var q = function (id) { return document.getElementById(id); };

  // The directory this file was served from. A service worker may only claim
  // the directory it came from, so a project page under /name/ proxies under
  // /name/__px/ and the base has to be worked out at runtime.
  var BASE = (function () {
    var p = location.pathname;
    var at = p.indexOf('/__px/');
    if (at >= 0) return p.slice(0, at + 1);
    if (/(?:^|\/)(?:index|200|404)\.html$/.test(p) || /\/$/.test(p)) return p.replace(/[^/]*$/, '');
    // A path the worker is meant to answer but hid from the address bar: the
    // base it last registered under is the only thing left to go on.
    try { return localStorage.getItem(BKEY) || '/'; } catch (e) { return '/'; }
  })();
  var SWPATH = BASE + 'sw.js';
  var PREFIX = BASE + '__px/';
  var HERE = location.origin + BASE;
  var home = location.pathname === BASE
    || /^(?:index|200|404)\.html$/.test(location.pathname.slice(BASE.length));

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (home) { try { localStorage.setItem(BKEY, BASE); } catch (e) {} }

  // Wait for a registration to have an active worker controlling this page.
  function active(reg) {
    return new Promise(function (done) {
      var tick = function () {
        var w = reg.installing || reg.waiting || reg.active;
        if (reg.active && sw.controller) return done(true);
        if (reg.active) return done(false);
        if (w) w.addEventListener('statechange', tick, { once: true });
      };
      if (sw.controller) return done(true);
      sw.addEventListener('controllerchange', function () { done(true); }, { once: true });
      tick();
    });
  }

  function arm() {
    if (!sw) return Promise.reject(new Error('This browser has no service workers.'));
    if (!self.isSecureContext) {
      return Promise.reject(new Error('A service worker needs https, or localhost.'));
    }
    return sw.register(SWPATH, { scope: BASE }).then(function (reg) {
      return active(reg).then(function () { return reg; });
    });
  }

  function ask(msg) {
    return new Promise(function (done) {
      var t = setTimeout(function () { done(null); }, 8000);
      var on = function (e) {
        if (!e.data || e.data.__px !== 'config') return;
        clearTimeout(t);
        sw.removeEventListener('message', on);
        done(e.data);
      };
      sw.addEventListener('message', on);
      try { sw.controller.postMessage(msg); } catch (e) { clearTimeout(t); done(null); }
    });
  }

  function target(raw) {
    var s = String(raw || '').trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
    try { return new URL(s).href; } catch (e) { return null; }
  }

  // ------------------------------------------------ not the home page
  // The host serves this same file for unknown paths, so a proxied URL lands
  // here whenever no worker is controlling the page yet: install one, then
  // reload so the worker answers the request instead.
  if (!home) {
    arm().then(function () {
      location.reload();
    }, function (err) {
      q('bs').className = 's off';
      q('bs').innerHTML = '<span class="d"></span>Error';
      q('bh').textContent = 'Could not start the proxy';
      q('bp').textContent = String(err && err.message || err) + '\n' + location.href;
    });
    return;
  }

  q('boot').className = 'c hide';
  q('home').className = 'c';
  q('eg').textContent = '<iframe src="' + location.origin + PREFIX + 'https://example.com/"></iframe>';
  q('pin').textContent = 'PROXY_ORIGIN = ' + HERE.replace(/\/$/, '');
  q('dep').textContent = BASE === '/'
    ? 'Deployed at the root: index.html and sw.js side by side. Add 404.html (a\ncopy of index.html) to embed this proxy from another origin.'
    : 'Deployed under ' + BASE + ': index.html and sw.js side by side. Add 404.html\n(a copy of index.html) to embed this proxy from another origin.';
  q('wisp').value = saved || WISP;

  var state = function (cls, label, text) {
    q('st').className = 's ' + cls;
    q('st').innerHTML = '<span class="d"></span>' + label;
    q('msg').textContent = text;
  };

  var url = new URL(location.href);
  var pending = target(url.searchParams.get('url'));

  arm().then(function () {
    return ask({ __px: 'config', wisp: saved || WISP });
  }).then(function (reply) {
    if (pending) { location.replace(location.origin + PREFIX + pending); return; }
    if (reply && !reply.ok) {
      state('off', 'Transport failed', 'The worker is running but could not load libcurl.js.');
      return;
    }
    var relay = (reply && reply.wisp) || saved || WISP;
    state('on', 'Ready', 'Proxying through ' + relay + '\nEvery path under ' + BASE + ' is served by the worker.');
  }, function (err) {
    state('off', 'Not running', String(err && err.message || err));
  });

  q('go').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = target(q('url').value);
    if (!t) { state('off', 'Invalid URL', 'Enter a public http or https address.'); return; }
    location.href = location.origin + PREFIX + t;
  });

  q('cfg').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = q('wisp').value.trim() || WISP;
    try { localStorage.setItem(KEY, v); } catch (err) {}
    saved = v;
    if (!sw || !sw.controller) { state('off', 'Not running', 'Install the worker first.'); return; }
    state('', 'Saving', 'Switching to ' + v);
    ask({ __px: 'config', wisp: v }).then(function (reply) {
      if (reply && !reply.ok) { state('off', 'Transport failed', 'Could not load libcurl.js.'); return; }
      state('on', 'Ready', 'Proxying through ' + ((reply && reply.wisp) || v));
    });
  });
})();
</script>
</body>
</html>
