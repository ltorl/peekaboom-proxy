<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peekaboom</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--fg:#1d1d1b;--mute:#6b6b66;--card:#fff;--line:#e4e4df}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ececea;--mute:#9a9a94;--card:#1e1e1c;--line:#2e2e2b}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
  .c{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  .s{color:var(--mute);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
  h1{margin:4px 0 12px;font-size:20px}
  pre,code{white-space:pre-wrap;word-break:break-all;font-size:13px}
  pre{color:var(--mute);margin:0}
</style>
</head>
<body>

<div class="c">
  <div class="s" id="s">Peekaboom</div>
  <h1 id="h">Embed a site</h1>
  <pre id="p"></pre>
</div>

<script>
(function () {
  // The default relay, as in proxy.js. ?wisp=wss://host/path/ picks another.
  var WISP = 'wss://anura.pro/';
  var BKEY = '__px_base';
  var sw = navigator.serviceWorker;
  var q = function (id) { return document.getElementById(id); };

  // The directory this file was served from. A service worker may only claim
  // the directory it came from, so a project page under /name/ proxies under
  // /name/__px/ and the base has to be worked out at runtime.
  var BASE = (function () {
    var p = location.pathname;
    var at = p.indexOf('/__px/');
    if (at >= 0) return p.slice(0, at + 1);
    if (/(?:^|\/)(?:index|200|404)\.html$/.test(p) || /\/$/.test(p)) return p.replace(/[^/]*$/, '');
    // A path the worker is meant to answer but hid from the address bar: the
    // base it last registered under is the only thing left to go on.
    try { return localStorage.getItem(BKEY) || '/'; } catch (e) { return '/'; }
  })();
  var SWPATH = BASE + 'sw.js';
  var PREFIX = BASE + '__px/';
  var home = location.pathname === BASE
    || /^(?:index|200|404)\.html$/.test(location.pathname.slice(BASE.length));

  if (home) { try { localStorage.setItem(BKEY, BASE); } catch (e) {} }

  // The page only ever changes to say why it is not working, which is the one
  // thing a static build can fail at that the server version could not.
  function fail(title, detail) {
    q('s').textContent = 'Error';
    q('h').textContent = title;
    q('p').textContent = String(detail);
  }

  // Wait for a registration to have an active worker controlling this page.
  function active(reg) {
    return new Promise(function (done) {
      var tick = function () {
        var w = reg.installing || reg.waiting || reg.active;
        if (reg.active && sw.controller) return done(true);
        if (reg.active) return done(false);
        if (w) w.addEventListener('statechange', tick, { once: true });
      };
      if (sw.controller) return done(true);
      sw.addEventListener('controllerchange', function () { done(true); }, { once: true });
      tick();
    });
  }

  function arm() {
    if (!sw) return Promise.reject(new Error('This browser has no service workers.'));
    if (!self.isSecureContext) {
      return Promise.reject(new Error('A service worker needs https, or localhost.'));
    }
    return sw.register(SWPATH, { scope: BASE }).then(function (reg) {
      return active(reg).then(function () { return reg; });
    });
  }

  function ask(msg) {
    return new Promise(function (done) {
      var t = setTimeout(function () { done(null); }, 8000);
      var on = function (e) {
        if (!e.data || e.data.__px !== 'config') return;
        clearTimeout(t);
        sw.removeEventListener('message', on);
        done(e.data);
      };
      sw.addEventListener('message', on);
      try { sw.controller.postMessage(msg); } catch (e) { clearTimeout(t); done(null); }
    });
  }

  function target(raw) {
    var s = String(raw || '').trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
    try { return new URL(s).href; } catch (e) { return null; }
  }

  function relay(raw) {
    try {
      var u = new URL(String(raw || '').trim());
      return /^wss?:$/.test(u.protocol) ? u.href : null;
    } catch (e) { return null; }
  }

  q('p').textContent = '<iframe src="' + location.origin + PREFIX + 'https://example.com/"></iframe>';

  // ------------------------------------------------ not the home page
  // The host serves this same file for unknown paths, so a proxied URL lands
  // here whenever no worker is controlling the page yet: install one, then
  // reload so the worker answers the request instead.
  if (!home) {
    arm().then(function () {
      location.reload();
    }, function (err) {
      fail('Could not start the proxy', (err && err.message || err) + '\n' + location.href);
    });
    return;
  }

  var params = new URL(location.href).searchParams;
  var pending = target(params.get('url'));
  var wisp = params.has('wisp') ? relay(params.get('wisp')) : WISP;
  if (!wisp) {
    fail('Invalid Wisp relay', 'Pass a ws:// or wss:// URL.\n' + params.get('wisp'));
    return;
  }

  arm().then(function () {
    return ask({ __px: 'config', wisp: wisp });
  }).then(function (reply) {
    if (pending) { location.replace(location.origin + PREFIX + pending); return; }
    if (reply && !reply.ok) {
      fail('Could not start the proxy', 'The worker is running but could not load libcurl.js.');
    }
  }, function (err) {
    fail('Could not start the proxy', err && err.message || err);
  });
})();
</script>
</body>
</html>
